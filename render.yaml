# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the Ofie Accra web service with a persistent disk for the database and photos.
services:
  - type: web
    name: ofie-accra
    runtime: node
    plan: starter          # a paid plan is required for a persistent disk
    region: frankfurt      # closest Render region to Ghana
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: ofie-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/ofie.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PRIVATE_DIR
        value: /var/data/private
      - key: SITE_NAME
        value: Ofie Accra
      # Set these in the Render dashboard when prompted:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: SMS_PROVIDER
        sync: false        # arkesel, hubtel, or log (log = texts printed to the Render logs, not sent)
      - key: SMS_SENDER_ID
        value: OfieAccra
      - key: ARKESEL_API_KEY
        sync: false
      - key: HUBTEL_CLIENT_ID
        sync: false
      - key: HUBTEL_CLIENT_SECRET
        sync: false
      # Email (optional): message alerts and password-reset links. Leave SMTP_HOST empty to turn email off.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
